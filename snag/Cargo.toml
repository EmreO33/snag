[package]
name = "snag"
version = "0.5.0"
edition = "2021"
description = "Snag - a fast, native video downloader built on yt-dlp"
authors = ["Snag"]
license = "GPL-3.0-or-later"
repository = "https://github.com/EmreO33/snag"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
arboard = { version = "3", default-features = false }
ureq = { version = "2", features = ["json", "tls"] }
png = "0.17"

# rfd needs a backend chosen per platform: Win32/Cocoa come for free, GTK does not.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
