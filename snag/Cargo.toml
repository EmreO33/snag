[package]
name = "snag"
version = "1.5.8"
edition = "2021"
description = "Snag - a fast, native video downloader built on yt-dlp"
authors = ["Snag"]
license = "GPL-3.0-or-later"
repository = "https://github.com/EmreO33/snag"

[dependencies]
# accesskit is what puts snag on the screen reader's map. It comes with
# eframe by default and was lost when default features were turned off to
# keep the binary small, which is a poor trade against being unusable.
eframe = { version = "0.29", default-features = false, features = ["accesskit", "glow", "default_fonts"] }
egui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
arboard = "3"
ureq = { version = "2", features = ["json", "tls"] }
png = "0.17"
# Deno arrives from its releases as a zip holding one binary. Deflate is the
# only method those zips use.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Thumbnails come back as jpeg or webp. The crate is already in the tree via
# eframe and arboard, so this only adds the two decoders.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }

# Desktop notifications, used to offer a copied link without stealing focus.
notify-rust = "4"

# The tray icon on Windows and macOS. Not on Linux, where tray-icon would need
# libayatana-appindicator at build time and on every user's machine.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(target_os = "linux")'.dependencies]
# The tray icon on Linux: a StatusNotifierItem, spoken over D-Bus, which is
# how KDE, Cinnamon, XFCE, Budgie and GNOME with the AppIndicator extension
# (Ubuntu's default) show tray icons. Pure Rust on the zbus notifications
# already bring, so no system library to install or to build against.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# The same zbus, for asking the Flatpak portal to start Snag at login.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# To pick X11 over Wayland when Snag should be able to hide in the tray:
# Wayland has no way to hide a window that keeps it running.
winit = { version = "0.30", default-features = false, features = ["x11"] }
# Starting in the tray without the window flashing up first: two properties
# the window manager reads before it shows a window. Both already in the tree
# through winit.
x11rb = { version = "0.13", default-features = false }
raw-window-handle = "0.6"

# File dialogs. Win32 and Cocoa come for free; on Linux the backend is one of
# the two features below, and rfd only pulls either in on Linux, so enabling
# one elsewhere costs nothing.
[dependencies.rfd]
version = "0.15"
default-features = false

[features]
default = ["gtk-file-dialogs"]
# GTK's own file chooser: works on every desktop, portal or not. What the
# .deb, .rpm, AUR package and AppImage use.
gtk-file-dialogs = ["rfd/gtk3"]
# The desktop portal's chooser. What the Flatpak uses, built with
# --no-default-features: a GTK chooser inside the sandbox can only see the
# sandbox, and the portal's runs outside it.
portal-file-dialogs = ["rfd/xdg-portal", "rfd/async-std"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
