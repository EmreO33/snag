[package]
name = "snag"
version = "1.2.0"
edition = "2021"
description = "Snag - a fast, native video downloader built on yt-dlp"
authors = ["Snag"]
license = "GPL-3.0-or-later"
repository = "https://github.com/EmreO33/snag"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
arboard = "3"
ureq = { version = "2", features = ["json", "tls"] }
png = "0.17"

# Thumbnails come back as jpeg or webp. The crate is already in the tree via
# eframe and arboard, so this only adds the two decoders.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }

# Desktop notifications, used to offer a copied link without stealing focus.
notify-rust = "4"

# A tray icon on Windows and macOS only: the Linux build would need
# libayatana-appindicator present at build time, which would put a new system
# dependency on the AppImage for a feature that is optional anyway.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

# rfd needs a backend chosen per platform: Win32/Cocoa come for free, GTK does not.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
