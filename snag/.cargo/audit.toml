# Advisories `cargo audit` is told to pass over, each with why it cannot
# reach Snag. Anything not listed here fails CI.
[advisories]
ignore = [
    # quick-xml 0.30: quadratic time on duplicate attributes, and unbounded
    # namespace declarations. It comes in on Linux only, through eframe's
    # screen reader support (accesskit -> atspi -> zbus-lockstep -> zbus_xml),
    # where it parses D-Bus interface descriptions built into the program,
    # never anything downloaded or received. Goes away with an eframe
    # upgrade.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
