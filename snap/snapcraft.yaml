# The snap, for the Snap Store. Built from source by the release workflow
# (snapcore/action-build), and uploaded to the store when the
# SNAPCRAFT_STORE_CREDENTIALS secret is set.
#
# The gnome extension brings GTK, the portals, fonts and GL from the shared
# gnome content snap, so this one only carries Snag and ffmpeg. yt-dlp is
# fetched and kept current by Snag itself, into the snap's own folder.
name: snag
title: Snag
base: core24
adopt-info: snag
summary: Download video and audio from almost any site
description: |
  Snag is a small, fast desktop front end for yt-dlp. Paste a link, pick what
  you want, and it downloads: from YouTube and more than a thousand other
  sites.

  - Video with sound, audio only, or video without sound
  - Pick the quality and the file type for each download
  - Pick items out of a playlist, or take all of them
  - A queue that survives a restart, and a searchable history
  - Clip a section of a video, split by chapters, save subtitles
  - Remux, extract audio, mute, or turn a file into a GIF

  Snag keeps yt-dlp up to date by itself, because sites change and an old
  yt-dlp is the usual reason a download stops working.
license: GPL-3.0-or-later
website: https://github.com/EmreO33/snag
issues: https://github.com/EmreO33/snag/issues
source-code: https://github.com/EmreO33/snag
icon: assets/icon.png
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  snag:
    command: bin/snag
    desktop: usr/share/applications/io.github.EmreO33.Snag.desktop
    common-id: io.github.EmreO33.Snag
    extensions: [gnome]
    environment:
      # ffmpeg links libblas and liblapack, which Ubuntu puts behind
      # update-alternatives links a snap does not get. Without these it
      # does not start, and Snag reports it missing.
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack:$LD_LIBRARY_PATH
    plugs:
      - network
      # Downloads go to ~/Downloads, and remux works on files anywhere in
      # home or on a removable drive.
      - home
      - removable-media

parts:
  snag:
    # Built by hand rather than with the rust plugin, whose toolchain setup
    # did not survive the build environment: the same rustup install every
    # other Linux build of Snag uses.
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - build-essential
      - libgtk-3-dev
      - libxkbcommon-dev
      - libxcb-render0-dev
      - libxcb-shape0-dev
      - libxcb-xfixes0-dev
      - libx11-dev
      - libgl1-mesa-dev
      - pkg-config
    override-pull: |
      craftctl default
      craftctl set version="$(grep -m1 '^version = ' snag/Cargo.toml | cut -d'"' -f2)"
    override-build: |
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo" RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs         | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      "$CARGO_HOME/bin/cargo" build --release --locked --manifest-path snag/Cargo.toml
      install -Dm755 snag/target/release/snag "$CRAFT_PART_INSTALL/bin/snag"
      install -Dm644 packaging/linux/io.github.EmreO33.Snag.metainfo.xml         "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.EmreO33.Snag.metainfo.xml"
      # The snap's icon, not a themed one the snap cannot see.
      sed 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|'         packaging/linux/io.github.EmreO33.Snag.desktop         > io.github.EmreO33.Snag.desktop
      install -Dm644 io.github.EmreO33.Snag.desktop         "$CRAFT_PART_INSTALL/usr/share/applications/io.github.EmreO33.Snag.desktop"

  ffmpeg:
    plugin: nil
    stage-packages:
      - ffmpeg
