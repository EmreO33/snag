name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish the binaries under"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows gets three artifacts: the bare exe, a portable zip, and an
  # installer. The other platforms ship the bare binary.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: build
        working-directory: snag
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          ./packaging/build-windows.ps1 `
            -Version $version `
            -SkipBuild `
            -ExePath "snag/target/x86_64-pc-windows-msvc/release/snag.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: snag-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: snag-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner image ships third party apt repositories, and a bad
          # index on any one of them fails the whole update with exit 100.
          # Everything below comes from ubuntu's own archive, so they go
          # before apt is asked anything. Ubuntu's own sources are kept.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.*' -delete
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev

      - name: build
        working-directory: snag
        # Remap build paths so the binary carries nothing about the machine it
        # was built on. The Windows job gets this from the packaging script.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=[cargo] --remap-path-prefix=$GITHUB_WORKSPACE=[snag]"
          cargo build --release --target ${{ matrix.target }}

      - name: stage the binary
        run: cp "snag/target/${{ matrix.target }}/release/snag" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error


  # Built inside an older ubuntu than the runner so the result is not pinned to
  # the runner's glibc: the plain binary needs 2.39, which rules out anything
  # older than Ubuntu 24.04.
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             curl ca-certificates build-essential file desktop-file-utils             libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev             libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev pkg-config

      - uses: actions/checkout@v4

      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: build
        working-directory: snag
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=[cargo] --remap-path-prefix=$GITHUB_WORKSPACE=[snag]"
          cargo build --release

      - name: assemble the AppDir
        run: |
          set -eux
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"                    "$APPDIR/usr/share/applications"                    "$APPDIR/usr/share/icons/hicolor/256x256/apps"                    "$APPDIR/usr/share/metainfo"
          cp snag/target/release/snag "$APPDIR/usr/bin/snag"
          cp packaging/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/linux/snag.desktop "$APPDIR/snag.desktop"
          cp packaging/linux/snag.desktop "$APPDIR/usr/share/applications/snag.desktop"
          cp assets/icon.png "$APPDIR/snag.png"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/snag.png"
          desktop-file-validate "$APPDIR/snag.desktop"

      - name: build the AppImage
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          curl -fsSL -o appimagetool             https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE inside the container, so run the tool from its own extraction.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run             AppDir "Snag-$version-x86_64.AppImage"
          file "Snag-$version-x86_64.AppImage"

      # Building it proves nothing about whether it runs. Execute it here, on
      # the same old glibc it claims to support, and check it can reach the
      # network too by resolving a real yt-dlp command.
      - name: run the AppImage
        run: |
          set -eux
          ldd --version | head -1
          chmod +x Snag-*.AppImage
          ./Snag-*.AppImage --appimage-extract-and-run             --print-command "https://example.com/video" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Snag-*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, unix, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes come out of CHANGELOG.md in the repo, so the tree has to be
      # here alongside the artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: list what will be published
        run: ls -la dist

      # Published so tooling can verify a download without fetching it twice:
      # the Scoop manifest reads its hashes straight out of this file.
      - name: write checksums
        working-directory: dist
        run: sha256sum Snag-* snag-* | tee SHA256SUMS.txt

      - name: build the release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A backstop for the CI check: nothing gets published without a note.
          bash packaging/release-notes.sh "$TAG" check
          bash packaging/release-notes.sh "$TAG" body > release-body.md
          {
            echo "title=$(bash packaging/release-notes.sh "$TAG" title)"
          } >> "$GITHUB_OUTPUT"
          echo "--- release page will read: ---"
          cat release-body.md

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          draft: false
          generate_release_notes: true
          body_path: release-body.md
          files: |
            dist/Snag-*
            dist/snag-*
            dist/SHA256SUMS.txt
