name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish the binaries under"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows gets three artifacts: the bare exe, a portable zip, and an
  # installer. The other platforms ship the bare binary.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: build
        working-directory: snag
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          ./packaging/build-windows.ps1 `
            -Version $version `
            -SkipBuild `
            -ExePath "snag/target/x86_64-pc-windows-msvc/release/snag.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: snag-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: snag-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev

      - name: build
        working-directory: snag
        # Remap build paths so the binary carries nothing about the machine it
        # was built on. The Windows job gets this from the packaging script.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=[cargo] --remap-path-prefix=$GITHUB_WORKSPACE=[snag]"
          cargo build --release --target ${{ matrix.target }}

      - name: stage the binary
        run: cp "snag/target/${{ matrix.target }}/release/snag" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error


  # Built inside an older ubuntu than the runner so the result is not pinned to
  # the runner's glibc: the plain binary needs 2.39, which rules out anything
  # older than Ubuntu 24.04.
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             curl ca-certificates build-essential file desktop-file-utils             libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev             libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev pkg-config

      - uses: actions/checkout@v4

      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: build
        working-directory: snag
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=[cargo] --remap-path-prefix=$GITHUB_WORKSPACE=[snag]"
          cargo build --release

      - name: assemble the AppDir
        run: |
          set -eux
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"                    "$APPDIR/usr/share/applications"                    "$APPDIR/usr/share/icons/hicolor/256x256/apps"                    "$APPDIR/usr/share/metainfo"
          cp snag/target/release/snag "$APPDIR/usr/bin/snag"
          cp packaging/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/linux/snag.desktop "$APPDIR/snag.desktop"
          cp packaging/linux/snag.desktop "$APPDIR/usr/share/applications/snag.desktop"
          cp assets/icon.png "$APPDIR/snag.png"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/snag.png"
          desktop-file-validate "$APPDIR/snag.desktop"

      - name: build the AppImage
        run: |
          set -eux
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          curl -fsSL -o appimagetool             https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE inside the container, so run the tool from its own extraction.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run             AppDir "Snag-$version-x86_64.AppImage"
          file "Snag-$version-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: Snag-*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, unix, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: list what will be published
        run: ls -la

      # Published so tooling can verify a download without fetching it twice:
      # the Scoop manifest reads its hashes straight out of this file.
      - name: write checksums
        run: sha256sum Snag-* snag-* | tee SHA256SUMS.txt

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            Snag-*
            snag-*
            SHA256SUMS.txt
          body: |
            ## Windows

            - **`Snag-*-windows-setup.exe`** — installer. Installs for you or for
              all users, adds a Start Menu entry, and uninstalls cleanly.
            - **`Snag-*-windows-portable.zip`** — portable. Unzip and run; it
              keeps everything in a `data` folder beside the executable and
              writes nothing else to the machine.
            - **`snag-windows-x86_64.exe`** — the bare executable.

            ## Linux

            - **`Snag-*-x86_64.AppImage`** — the recommended Linux build. Runs on
              any distro with glibc 2.35 or newer, and integrates with your
              application menu. `chmod +x` it and run it.
            - **`snag-linux-x86_64`** — the bare binary. Needs glibc 2.39+.

            ## macOS

            `snag-macos-aarch64`, a bare binary. Builds in CI but has not been run
            by anyone yet, so treat it as untested.

            ---

            Snag does not ship yt-dlp. On first launch it offers to download the
            current yt-dlp release from the yt-dlp project's own GitHub releases.
            ffmpeg is required separately and is not installed by Snag.
