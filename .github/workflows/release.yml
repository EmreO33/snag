name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish the binaries under"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows gets three artifacts: the bare exe, a portable zip, and an
  # installer. The other platforms ship the bare binary.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: build
        working-directory: snag
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          ./packaging/build-windows.ps1 `
            -Version $version `
            -SkipBuild `
            -ExePath "snag/target/x86_64-pc-windows-msvc/release/snag.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: snag-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: snag-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev

      - name: build
        working-directory: snag
        run: cargo build --release --target ${{ matrix.target }}

      - name: stage the binary
        run: cp "snag/target/${{ matrix.target }}/release/snag" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: list what will be published
        run: ls -la

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            Snag-*
            snag-*
          body: |
            ## Windows

            - **`Snag-*-windows-setup.exe`** — installer. Installs for you or for
              all users, adds a Start Menu entry, and uninstalls cleanly.
            - **`Snag-*-windows-portable.zip`** — portable. Unzip and run; it
              keeps everything in a `data` folder beside the executable and
              writes nothing else to the machine.
            - **`snag-windows-x86_64.exe`** — the bare executable.

            ## Linux and macOS

            Bare binaries. These build in CI but have not been run by anyone yet,
            so treat them as untested.

            ---

            Snag does not ship yt-dlp. On first launch it offers to download the
            current yt-dlp release from the yt-dlp project's own GitHub releases.
            ffmpeg is required separately and is not installed by Snag.
