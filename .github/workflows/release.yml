name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish the binaries under"
        required: true
      publish:
        description: "publish a release (off builds every package and stops there)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows gets three artifacts: the bare exe, a portable zip, and an
  # installer. The other platforms ship the bare binary.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: build
        working-directory: snag
        run: cargo build --release --target x86_64-pc-windows-msvc

      # The one check that would have caught the winget validator's finding:
      # nothing gets packaged that needs a runtime a clean windows lacks.
      - name: the binary needs no visual c++ runtime
        run: |
          python -m pip install --quiet pefile
          python packaging/check-imports.py snag/target/x86_64-pc-windows-msvc/release/snag.exe

      - name: package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          ./packaging/build-windows.ps1 `
            -Version $version `
            -SkipBuild `
            -ExePath "snag/target/x86_64-pc-windows-msvc/release/snag.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      - name: build
        working-directory: snag
        # Remap build paths so the binary carries nothing about the machine it
        # was built on. The Windows job gets this from the packaging script.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=[cargo] --remap-path-prefix=$GITHUB_WORKSPACE=[snag]"
          cargo build --release --target aarch64-apple-darwin

      - name: stage the binary
        run: cp snag/target/aarch64-apple-darwin/release/snag snag-macos-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: snag-macos-aarch64
          path: snag-macos-aarch64
          if-no-files-found: error

  # Every Linux package, from one binary built inside an older Ubuntu than
  # the runner so it is not pinned to the runner's glibc: this one needs
  # 2.35, so Ubuntu 22.04, Debian 12, Fedora 36 and anything newer.
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential file desktop-file-utils appstream \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev pkg-config

      - uses: actions/checkout@v4

      - name: install rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: build
        working-directory: snag
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=[cargo] --remap-path-prefix=$GITHUB_WORKSPACE=[snag]"
          cargo build --release

      - name: the desktop entry and the metadata are valid
        run: |
          desktop-file-validate packaging/linux/io.github.EmreO33.Snag.desktop
          appstreamcli validate --no-net packaging/linux/io.github.EmreO33.Snag.metainfo.xml

      - name: build the packages
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          bash packaging/linux/build-packages.sh "${tag#v}" snag/target/release/snag dist

      # Building them proves nothing about whether they run. Install the deb
      # into this very system, on the old glibc it claims to support, and
      # start the AppImage without FUSE, the way a container has to.
      - name: the packages install and run
        run: |
          set -eux
          ldd --version | head -1
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/snag_*_amd64.deb
          snag --version
          snag --version | grep -q "installed from the .deb package"
          ./dist/Snag-*-x86_64.AppImage --appimage-extract-and-run --version
          ./dist/Snag-*-x86_64.AppImage --appimage-extract-and-run \
            --print-command "https://example.com/video" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Snag-*.AppImage
            dist/snag_*.deb
            dist/snag-*.rpm
            dist/snag-*-linux-x86_64.tar.gz
            dist/snag-linux-x86_64
          if-no-files-found: error

  # The Flatpak, built from the manifest Flathub builds from, so a change
  # that breaks it is found here rather than in Flathub's build queue. The
  # bundle it makes goes on the release page too, for anyone without Flathub.
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Built from this checkout rather than from the tag the manifest names,
      # so the job also works on a run that is not a release.
      - name: point the manifest at this checkout
        run: |
          python3 - <<'PY'
          import re
          p = 'packaging/flatpak/io.github.EmreO33.Snag.yml'
          s = open(p).read()
          s, n = re.subn(r"      - type: git\n        url: https://github.com/EmreO33/snag.git\n        tag: v[0-9.]+\n",
                         "      - type: dir\n        path: ../..\n", s)
          assert n == 1, "the snag source in the manifest has changed shape"
          open(p, 'w').write(s)
          PY

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.EmreO33.Snag.yml
          bundle: Snag-${{ inputs.tag || github.ref_name }}-x86_64.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: rename the bundle
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mv "Snag-$tag-x86_64.flatpak" "Snag-${tag#v}-x86_64.flatpak"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Snag-*.flatpak
          if-no-files-found: error

  # The snap, built in the same clean environment the Snap Store uses. It is
  # uploaded to the store only once the store credentials exist as a secret;
  # until then it is built, and attached to the release, and that is all.
  snap:
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - uses: snapcore/action-build@v1
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: publish to the snap store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != '' && (github.event_name == 'push' || inputs.publish)
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  publish:
    needs: [windows, macos, linux, flatpak, snap]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes come out of CHANGELOG.md in the repo, so the tree has to be
      # here alongside the artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: list what will be published
        run: ls -la dist

      # Published so tooling can verify a download without fetching it twice:
      # the Scoop manifest reads its hashes straight out of this file.
      - name: write checksums
        working-directory: dist
        run: sha256sum Snag-* snag-* snag_* | tee SHA256SUMS.txt

      - name: build the release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A backstop for the CI check: nothing gets published without a note.
          bash packaging/release-notes.sh "$TAG" check
          bash packaging/release-notes.sh "$TAG" body > release-body.md
          {
            echo "title=$(bash packaging/release-notes.sh "$TAG" title)"
          } >> "$GITHUB_OUTPUT"
          echo "--- release page will read: ---"
          cat release-body.md

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          draft: false
          generate_release_notes: true
          body_path: release-body.md
          files: |
            dist/Snag-*
            dist/snag-*
            dist/snag_*
            dist/SHA256SUMS.txt

  # The AUR package, once there is a key to push it with: the PKGBUILD gets
  # this release's version and the tarball's checksum, and goes up. Without
  # the AUR_SSH_PRIVATE_KEY secret this step does nothing.
  aur:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fill in the version and checksum
        id: pkgbuild
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "no AUR_SSH_PRIVATE_KEY secret, so nothing is pushed to the AUR"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          url="https://github.com/EmreO33/snag/releases/download/$tag/snag-$version-linux-x86_64.tar.gz"
          sum="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/PKGBUILD
          cat packaging/aur/PKGBUILD
          echo "push=true" >> "$GITHUB_OUTPUT"

      - uses: KSXGitHub/github-actions-deploy-aur@v4
        if: steps.pkgbuild.outputs.push == 'true'
        with:
          pkgname: snag-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Emre Demir
          commit_email: 274893088+EmreO33@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ inputs.tag || github.ref_name }}
