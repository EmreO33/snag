name: snap upload

# Put a release's snap in the Snap Store again.
#
# By default it uploads the snap exactly as published on the GitHub release
# page: for a release that went out before the store was set up, or one that
# needs publishing again. With "rebuild" on, it builds the snap afresh from the
# release's tag instead, which is what the store's "contains outdated Ubuntu
# packages" emails ask for: the same Snag, with the Ubuntu libraries it carries
# (ffmpeg's, mostly) brought up to their current security updates.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag whose snap to upload, e.g. v1.5.5"
        required: true
      channel:
        description: "store channel to release it to"
        default: stable
      rebuild:
        description: "build it again from the tag, for current Ubuntu security updates"
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: fetch the snap from the release
        if: ${{ !inputs.rebuild }}
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          gh release download "$tag" -R "${{ github.repository }}" -p "snag_*_amd64.snap"
          ls -la snag_*.snap
          echo "snap=$(ls snag_*_amd64.snap | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ inputs.rebuild }}
        with:
          ref: ${{ inputs.tag }}

      - uses: snapcore/action-build@v1
        if: ${{ inputs.rebuild }}
        id: build

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ inputs.rebuild && steps.build.outputs.snap || steps.fetch.outputs.snap }}
          release: ${{ inputs.channel }}
