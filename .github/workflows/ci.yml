name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      # eframe needs the GL/X11 headers, and rfd's GTK backend needs GTK.
      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev

      - name: fmt
        working-directory: snag
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: snag
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: snag
        run: cargo test

      - name: build
        working-directory: snag
        run: cargo build --release
