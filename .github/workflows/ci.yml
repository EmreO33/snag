name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every release gets a changelog entry, so a version bump without one is a
  # mistake worth catching here rather than at the moment of publishing.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the version being built has a changelog entry
        run: |
          version="$(grep -m1 '^version = ' snag/Cargo.toml | cut -d'"' -f2)"
          bash packaging/release-notes.sh "v$version" check

  # The Linux packages each carry the version somewhere of their own, and a
  # release that forgets one ships a store listing that is out of date.
  linux-packaging:
    name: linux packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the validators
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.*' -delete
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          python3 -m pip install --quiet aiohttp tomlkit

      - name: the desktop entry and the metadata are valid
        run: |
          desktop-file-validate packaging/linux/io.github.EmreO33.Snag.desktop
          appstreamcli validate --no-net packaging/linux/io.github.EmreO33.Snag.metainfo.xml

      - name: the metadata and the flatpak manifest name this version
        run: |
          version="$(grep -m1 '^version = ' snag/Cargo.toml | cut -d'"' -f2)"
          metainfo=packaging/linux/io.github.EmreO33.Snag.metainfo.xml
          manifest=packaging/flatpak/io.github.EmreO33.Snag.yml
          if ! grep -q "<release version=\"$version\"" "$metainfo"; then
            echo "::error::the metainfo has no <release> for $version"
            exit 1
          fi
          if ! grep -q "tag: v$version$" "$manifest"; then
            echo "::error::the flatpak manifest does not build v$version"
            exit 1
          fi

      # Flathub builds offline, from exactly the crates listed here. A
      # Cargo.lock change without regenerating this breaks the Flathub build.
      - name: the flatpak's crate list matches Cargo.lock
        run: |
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py snag/Cargo.lock -o /tmp/cargo-sources.json
          if ! diff -q /tmp/cargo-sources.json packaging/flatpak/cargo-sources.json; then
            echo "::error::packaging/flatpak/cargo-sources.json is stale: regenerate it from Cargo.lock"
            exit 1
          fi

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snag

      # eframe needs the GL/X11 headers, and rfd's GTK backend needs GTK.
      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner image ships third party apt repositories, and a bad
          # index on any one of them fails the whole update with exit 100.
          # Everything below comes from ubuntu's own archive, so they go
          # before apt is asked anything. Ubuntu's own sources are kept.
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.*' -delete
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev

      - name: fmt
        working-directory: snag
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: snag
        run: cargo clippy --all-targets -- -D warnings

      # The Flatpak's build: the portal's file dialogs instead of GTK's.
      - name: clippy, portal file dialogs
        if: runner.os == 'Linux'
        working-directory: snag
        run: cargo clippy --all-targets --no-default-features --features portal-file-dialogs -- -D warnings

      - name: test
        working-directory: snag
        run: cargo test

      - name: build
        working-directory: snag
        run: cargo build --release

      # Actually fetch and run yt-dlp on a clean machine. This is the check that
      # would have caught shipping the python zipapp: it downloaded fine and
      # then failed to exec, which no amount of compiling would reveal.
      # A clean windows has no visual c++ runtime, so the binary must not
      # need one. Checked on the finished file rather than trusted to a flag.
      - name: the windows binary needs no visual c++ runtime
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet pefile
          python packaging/check-imports.py snag/target/release/snag.exe

      - name: smoke test the yt-dlp installer
        if: runner.os == 'Linux'
        run: |
          set -eux
          ./snag/target/release/snag --install-ytdlp "$RUNNER_TEMP/ytdlp"
          file "$RUNNER_TEMP/ytdlp/yt-dlp"
          "$RUNNER_TEMP/ytdlp/yt-dlp" --version
